name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install dependencies
        run: Rscript install_dependencies.R
      - name: Unit tests
        run: Rscript tests/run_tests.R
      - name: Demo pipeline (synthetic data)
        run: Rscript run_analysis.R --demo
